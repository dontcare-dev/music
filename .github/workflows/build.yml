name: Build Android and Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - name: Add JitPack repository for NewPipe Extractor
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("android/settings.gradle.kts", "android/settings.gradle"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              if "https://jitpack.io" not in s:
                  if name.endswith(".kts"):
                      s = s.replace("repositories {", 'repositories {\n        maven { url = uri("https://jitpack.io") }', 1)
                  else:
                      s = s.replace("repositories {", "repositories {\n        maven { url 'https://jitpack.io' }", 1)
                  p.write_text(s)
              break
          else:
              raise SystemExit("Generated Gradle settings file not found")
          PY
      - name: Set Android compile SDK
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Add media library permission
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          '''
          if "android.permission.READ_MEDIA_AUDIO" not in s:
              s = s.replace("<application", permissions + "\n    <application", 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Pin NewPipe Extractor to published release
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["HOME"]) / ".pub-cache" / "git"
          matches = list(root.glob("**/flutter_new_pipe_extractor-*/android/build.gradle"))
          if not matches:
              raise SystemExit("flutter_new_pipe_extractor Android Gradle file not found")
          for path in matches:
              source = path.read_text()
              old = "com.github.teamnewpipe:NewPipeExtractor:6992806323864d353c90ae180fa79bf3d98f07c8"
              if old not in source:
                  raise SystemExit(f"Expected NewPipe dependency not found in {path}")
              path.write_text(source.replace(old, "com.github.teamnewpipe.NewPipeExtractor:extractor:v0.24.8"))
          PY
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: silver-music-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: silver-music-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
