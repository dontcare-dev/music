name: Build Android and Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - name: Add JitPack repository for NewPipe Extractor
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("android/build.gradle.kts", "android/build.gradle"):
              p = Path(name)
              if not p.exists():
                  continue
              source = p.read_text()
              marker = "allprojects {"
              start = source.find(marker)
              if start < 0:
                  source += '\nallprojects { repositories { maven { url = uri("https://jitpack.io") } } }\n' if name.endswith(".kts") else "\nallprojects { repositories { maven { url 'https://jitpack.io' } } }\n"
              else:
                  repo = source.find("repositories {", start)
                  if repo < 0:
                      raise SystemExit("allprojects repositories block not found")
                  insert_at = repo + len("repositories {")
                  if "https://jitpack.io" not in source:
                      entry = '\n        maven { url = uri("https://jitpack.io") }' if name.endswith(".kts") else "\n        maven { url 'https://jitpack.io' }"
                      source = source[:insert_at] + entry + source[insert_at:]
              p.write_text(source)
              break
          else:
              raise SystemExit("Generated Android root Gradle build file not found")
          PY
      - name: Set Android compile SDK
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Enable core library desugaring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          source = p.read_text()
          marker = "compileOptions {"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("compileOptions block not found")
          end = source.find("}", start)
          block = source[start:end]
          if "isCoreLibraryDesugaringEnabled" not in block:
              source = source[:end] + "\n        isCoreLibraryDesugaringEnabled = true" + source[end:]
          if "coreLibraryDesugaring(" not in source:
              dep = source.find("dependencies {")
              if dep < 0:
                  source += '\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5") }\n'
              else:
                  insert_at = dep + len("dependencies {")
                  source = source[:insert_at] + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' + source[insert_at:]
          p.write_text(source)
          PY
      - name: Stabilize Android release shrinker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          source = p.read_text()
          match = re.search(r"buildTypes\s*\{", source)
          if not match:
              raise SystemExit("buildTypes block not found")
          release = re.search(r"release\s*\{", source[match.end():])
          if not release:
              raise SystemExit("release build type not found")
          start = match.end() + release.end() - 1
          depth = 0
          end = None
          for i in range(start, len(source)):
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit("release block is unbalanced")
          body = source[start:end]
          if "isMinifyEnabled" not in body:
              source = source[:end] + "\n            isMinifyEnabled = false\n            isShrinkResources = false\n        " + source[end:]
          p.write_text(source)
          rules = Path("android/app/proguard-rules.pro")
          rules.write_text(
              "-keep class org.mozilla.javascript.** { *; }\n"
              "-keep class org.mozilla.classfile.ClassFileWriter { *; }\n"
              "-dontwarn org.mozilla.javascript.tools.**\n"
              "-dontwarn java.beans.**\n"
          )
          PY
      - name: Add media library permission
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          '''
          if "android.permission.READ_MEDIA_AUDIO" not in s:
              s = s.replace("<application", permissions + "\n    <application", 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Pin NewPipe Extractor to published release
        run: |
          python - <<'PY'
          from pathlib import Path
          import glob
          files = [Path(p) for p in glob.glob(str(Path.home() / ".pub-cache/git/*/android/build.gradle"))]
          matches = []
          for p in files:
              source = p.read_text()
              if "6992806323864d353c90ae180fa79bf3d98f07c8" in source:
                  p.write_text(source.replace("6992806323864d353c90ae180fa79bf3d98f07c8", "0.26.5"))
                  matches.append(str(p))
          if not matches:
              raise SystemExit("Could not locate flutter_new_pipe_extractor Gradle dependency")
          print("Pinned NewPipe Extractor in:", *matches, sep="\\n")
          PY
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: silver-music-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: silver-music-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
